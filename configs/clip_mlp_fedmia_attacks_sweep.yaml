name: clip_mlp_fedmia_attacks
base_config: configs/clip_mlp_low_fpr_attacks.yaml
results_root: results

gpus: [0]
jobs: 1
seeds: [42]
# One anchor job per dataset/seed; the audit itself targets every client.
target_client_ids: [0]

# Use one shared FedMIA training schedule across all full-data datasets.
datasets:
  - name: caltech101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 150
  - name: oxfordpets
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 150
  - name: flowers
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 150
  - name: food101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 150
  - name: cifar100
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 150

common:
  model_type: clip_mlp
  aggregator: fedavg
  aggregation_weighting: uniform
  data_root: ./data
  cache_dir: ./checkpoints/clip-vit-base-patch32
  require_cuda: true
  # Use an IID client split for record-level MIA evaluation. This avoids
  # letting attacks exploit the target client's non-IID label distribution.
  partition_mode: iid
  # Retained for config/CLI compatibility; ignored when partition_mode=iid.
  dirichlet_alpha: 0.1
  use_full_dataset: true
  fpl_shots: null
  local_epochs: 1
  learning_rate: 0.001
  # Keep the client learning rate constant for all communication rounds.
  learning_rate_decay: 1.0
  batch_size: 32
  eval_batch_size: 512
  eval_interval: 5
  save_models: false
  clip_mlp:
    hidden_dim: 512
    dropout: 0.0
    normalize_features: false
    precompute_features: true
    precompute_batch_size: 64
  audit:
    enabled: true
    strict: true
    audit_client_ids: all
    target_client_id: 0
    ensure_target_participation: true
    attacks:
      - blackbox_loss
      - loss_series
      - grad_cosine
      - avg_cosine
      - fedmia_loss
      - fedmia_cosine
      - gradient_diff
      - score_diff
      - score_ratio
      - fta
    candidate_sampling: balanced_holdout
    # Per client, pair target-train members with never-trained target-test
    # non-members using identical class counts and a strict 1:1 ratio.
    low_fpr_max_members: 5000
    low_fpr_max_nonmembers: 5000
    match_candidate_labels: true
    audit_batch_size: 512
    attack_audit_intervals:
      # Measure every 10 completed rounds: rounds 10, 20, ..., 150.
      loss_series: 10
      avg_cosine: 10
      fedmia_loss: 10
      fedmia_cosine: 10
      gradient_diff: 10
      score_diff: 10
      score_ratio: 10
      fta: 10
    score_ratio_damping: 1.0e-6
    fta_measurement: confidence
    low_fpr_gradient_batch_size: 16
    signal_storage: compact
    fedmia_tail: upper
    fedmia_tail_calibration_fraction: 0.25
    training_health_check: true

# ProjRes is reserved for the Visual Adapter FedSGD sweep. CLIP-MLP runs the
# ten common attacks with its original fixed-candidate FedAvg protocol.
projres:
  enabled: false
  evaluation_round: last
  decision_mode: ranking
  threshold: null
  max_candidates: 32
  min_nonmembers: 1000
  max_nonmembers: 20000

defenses:
  - name: none
