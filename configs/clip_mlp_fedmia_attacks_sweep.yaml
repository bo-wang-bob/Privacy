name: clip_mlp_fedmia_attacks
base_config: configs/clip_mlp_low_fpr_attacks.yaml
results_root: results

gpus: [0]
jobs: 1
seeds: [42]
# One target-client audit job per dataset/seed, matching the BERT protocol.
target_client_ids: [0]

# Use one shared few-shot FedSGD schedule across all datasets.
datasets:
  - name: caltech101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 150
  - name: oxfordpets
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 150
  - name: flowers
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 150
  - name: food101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 150
  - name: cifar100
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 150

common:
  model_type: clip_mlp
  aggregator: fedsgd
  aggregation_weighting: uniform
  data_root: ./data
  cache_dir: ./checkpoints/clip-vit-base-patch32
  require_cuda: true
  # Use an IID client split for record-level MIA evaluation. This avoids
  # letting attacks exploit the target client's non-IID label distribution.
  partition_mode: iid
  # Retained for config/CLI compatibility; ignored when partition_mode=iid.
  dirichlet_alpha: 0.1
  use_full_dataset: false
  fpl_shots: 16
  local_epochs: 1
  learning_rate: 0.1
  # Keep the client learning rate constant for all communication rounds.
  learning_rate_decay: 1.0
  batch_size: 32
  eval_batch_size: 512
  eval_interval: 5
  save_models: false
  clip_mlp:
    hidden_dim: 512
    dropout: 0.0
    normalize_features: false
    precompute_features: true
    precompute_batch_size: 64
  audit:
    enabled: true
    strict: true
    audit_client_ids: [0]
    target_client_id: 0
    ensure_target_participation: true
    attacks:
      - blackbox_loss
      - loss_series
      - grad_cosine
      - avg_cosine
      - fedmia_loss
      - fedmia_cosine
      - gradient_diff
      - score_diff
      - score_ratio
      - fta
      - projres
    candidate_sampling: balanced_global_holdout
    require_full_target_train_members: true
    nonmember_to_member_ratio: 1
    exact_batch_membership_attacks:
      - blackbox_loss
      - grad_cosine
      - gradient_diff
      - projres
      - score_diff
      - score_ratio
    exact_batch_nonmember_to_member_ratio: 10
    paper_balanced_evaluation_size: 100
    low_fpr_min_nonmembers: 2
    low_fpr_max_members: 0
    low_fpr_max_nonmembers: 0
    match_candidate_labels: true
    audit_batch_size: 512
    attack_audit_intervals:
      # Measure every 10 completed rounds: rounds 10, 20, ..., 150.
      blackbox_loss: 10
      loss_series: 10
      grad_cosine: 10
      avg_cosine: 10
      fedmia_loss: 10
      fedmia_cosine: 10
      gradient_diff: 10
      score_diff: 10
      score_ratio: 10
      fta: 10
      projres: 10
    score_ratio_damping: 1.0e-6
    fta_measurement: confidence
    low_fpr_gradient_batch_size: 16
    signal_storage: compact
    fedmia_tail: upper
    fedmia_tail_calibration_fraction: 0.25
    training_health_check: true

# ProjRes shares the exact same 32/320 view as the other exact-batch attacks.
projres:
  enabled: true
  evaluation_interval: 10
  decision_mode: ranking
  threshold: null
  max_candidates: 32
  min_nonmembers: 320
  max_nonmembers: 320

defenses:
  - name: none
