name: clip_mlp_fedmia_attacks
base_config: configs/clip_mlp_low_fpr_attacks.yaml
results_root: results

gpus: [0]
jobs: 1
seeds: [42]
target_client_ids: [0]

# Use one shared FedMIA training schedule across all full-data datasets.
datasets:
  - name: caltech101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: oxfordpets
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: flowers
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: food101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: cifar100
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300

common:
  model_type: clip_mlp
  train_mode: centralized
  aggregator: fedavg
  data_root: ./data
  cache_dir: ./checkpoints/clip-vit-base-patch32
  require_cuda: true
  # Use an IID client split for record-level MIA evaluation. This avoids
  # letting attacks exploit the target client's non-IID label distribution.
  partition_mode: iid
  # Retained for config/CLI compatibility; ignored when partition_mode=iid.
  dirichlet_alpha: 0.1
  use_full_dataset: true
  fpl_shots: null
  local_epochs: 1
  learning_rate: 0.001
  # Step decay: keep LR fixed for five rounds, then multiply it by 0.99.
  learning_rate_decay: 0.99
  learning_rate_decay_interval: 5
  batch_size: 32
  eval_batch_size: 512
  eval_interval: 5
  save_models: false
  clip_mlp:
    hidden_dim: 512
    dropout: 0.0
    normalize_features: false
    precompute_features: true
    precompute_batch_size: 64
  audit:
    enabled: true
    strict: true
    target_client_id: 0
    ensure_target_participation: true
    attacks:
      - blackbox_loss
      - loss_series
      - grad_cosine
      - avg_cosine
      - fedmia_loss
      - fedmia_cosine
    candidate_sampling: low_fpr_full
    low_fpr_min_nonmembers: 1000
    # Deterministic class-stratified caps. Smaller datasets still use all data.
    low_fpr_max_members: 5000
    low_fpr_max_nonmembers: 20000
    match_candidate_labels: false
    audit_batch_size: 512
    audit_interval: 5
    attack_audit_intervals:
      # Match the released FedMIA code's checkpoints: rounds 10, 20, ..., 300.
      loss_series: 10
      avg_cosine: 10
      fedmia_loss: 10
      fedmia_cosine: 10
    low_fpr_gradient_batch_size: 16
    signal_storage: compact
    # Save one candidate-aligned copy of the frozen CLIP image vectors so
    # successful/failed membership inferences can be analyzed after training.
    save_candidate_clip_features: true
    fedmia_tail: upper
    fedmia_tail_calibration_fraction: 0.25
    training_health_check: true

# ProjRes remains a separate strict one-batch/one-step experiment because its
# threat model is not the multi-round FedAvg trace used by the other attacks.
projres:
  enabled: true
  threshold: 0.01
  max_candidates: 32
  min_nonmembers: 1000
  max_nonmembers: 0

defenses:
  - name: none
