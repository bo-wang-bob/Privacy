model_type: visual_adapter
dataset_name: caltech101
data_root: ./data
batch_size: 32
eval_batch_size: 512
learning_rate: 0.001
learning_rate_decay: 1.0
num_global_iters: 20
local_epochs: 1
total_users: 10
sample_users: 10
aggregator: fedsgd
aggregation_weighting: uniform

visual_adapter:
  feature_dim: 512
  reduction: 4
  alpha: 0.2
  output_relu: true
  text_adapter_enabled: true
  text_reduction: 4
  text_alpha: 0.2
  text_output_relu: true
  precompute_features: true
  precompute_batch_size: 64
  template: null

partition_mode: dirichlet
dirichlet_alpha: 0.1
use_full_dataset: true
fpl_shots: null
gpu: 0
seed: 42
cache_dir: ./checkpoints/clip-vit-base-patch32
model_load_path: null
save_models: false
eval_interval: 5
results_dir: ./results

audit:
  enabled: true
  strict: true
  audit_view: protocol_plus_released_prompts
  target_client_id: 0
  ensure_target_participation: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - gradient_diff
    - score_diff
    - score_ratio
    - fta
  max_samples_per_group: 32
  audit_batch_size: 512
  calibration_fraction: 0.5
  auxiliary_fraction: 0.5
  signal_storage: compact

defense:
  name: none
