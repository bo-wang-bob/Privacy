model_type: clip_lora
dataset_name: caltech101
data_root: ./data
cache_dir: ./checkpoints/clip-vit-base-patch32
require_cuda: true
partition_mode: iid
dirichlet_alpha: 0.1
use_full_dataset: true
fpl_shots: null

batch_size: 32
eval_batch_size: 128
learning_rate: 0.0002
learning_rate_decay: 1.0
num_global_iters: 300
local_epochs: 1
total_users: 10
sample_users: 10
aggregator: fedsgd
aggregation_weighting: uniform
fedsgd:
  client_optimizer: sgd
  momentum: 0.0
  weight_decay: 0.0

clip_lora:
  encoder: both
  target_modules: [q, k, v]
  layers: all
  rank: 2
  alpha: 1.0
  dropout: 0.0
  scaling: sqrt_rank
  template: null

eval_interval: 5
save_models: false
audit:
  enabled: true
  strict: true
  # Exact-batch membership requires a single target client, matching the
  # BERT/GPT2 and Visual Adapter protocol.
  audit_client_ids: [0]
  target_client_id: 0
  ensure_target_participation: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
    - gradient_diff
    - score_diff
    - score_ratio
    - fta
    - projres
  candidate_sampling: balanced_global_holdout
  require_full_target_train_members: true
  nonmember_to_member_ratio: 1
  exact_batch_membership_attacks:
    - blackbox_loss
    - grad_cosine
    - gradient_diff
    - projres
    - score_diff
    - score_ratio
  exact_batch_nonmember_to_member_ratio: 10
  paper_balanced_evaluation_size: 100
  low_fpr_min_nonmembers: 2
  low_fpr_max_members: 0
  low_fpr_max_nonmembers: 0
  match_candidate_labels: true
  audit_batch_size: 64
  attack_audit_intervals:
    blackbox_loss: 10
    loss_series: 10
    grad_cosine: 10
    avg_cosine: 10
    fedmia_loss: 10
    fedmia_cosine: 10
    gradient_diff: 10
    score_diff: 10
    score_ratio: 10
    fta: 10
    projres: 10
  score_ratio_damping: 1.0e-6
  fta_measurement: confidence
  low_fpr_gradient_batch_size: 1
  signal_storage: compact
  fedmia_tail: upper
  fedmia_tail_calibration_fraction: 0.25
  training_health_check: true

projres:
  enabled: true
  evaluation_interval: 10
  decision_mode: ranking
  threshold: null
  max_candidates: 32
  min_nonmembers: 320
  max_nonmembers: 320
  attacked_parameter: clip_model.vision_model.encoder.layers.0.self_attn.q_proj.lora_A
  token_reduction: cls
defense:
  name: none
