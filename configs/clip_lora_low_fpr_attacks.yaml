model_type: clip_lora
dataset_name: caltech101
data_root: ./data
cache_dir: ./checkpoints/clip-vit-base-patch32
require_cuda: true
partition_mode: iid
dirichlet_alpha: 0.1
use_full_dataset: true
fpl_shots: null

batch_size: 32
eval_batch_size: 128
learning_rate: 0.0002
learning_rate_decay: 1.0
num_global_iters: 300
local_epochs: 1
total_users: 10
sample_users: 10
aggregator: fedsgd
aggregation_weighting: uniform
fedsgd:
  client_optimizer: sgd
  momentum: 0.0
  weight_decay: 0.0

clip_lora:
  encoder: both
  target_modules: [q, k, v]
  layers: all
  rank: 2
  alpha: 1.0
  dropout: 0.0
  scaling: sqrt_rank
  template: null

eval_interval: 5
save_models: false
audit:
  enabled: true
  strict: true
  audit_client_ids: all
  target_client_id: 0
  ensure_target_participation: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
  # Vision-side LoRA needs raw pixels, so the frozen-feature low_fpr_full pool
  # is not applicable. This protocol gives every client exact 1:1, same-class
  # train-member and never-trained test-nonmember candidates.
  candidate_sampling: balanced_holdout
  low_fpr_max_members: 5000
  low_fpr_max_nonmembers: 5000
  match_candidate_labels: true
  audit_batch_size: 64
  attack_audit_intervals:
    loss_series: 10
    avg_cosine: 10
    fedmia_loss: 10
    fedmia_cosine: 10
  low_fpr_gradient_batch_size: 1
  signal_storage: compact
  fedmia_tail: upper
  fedmia_tail_calibration_fraction: 0.25
  training_health_check: true

projres:
  enabled: true
  evaluation_round: last
  threshold: 0.01
  max_candidates: 32
  min_nonmembers: 1000
  max_nonmembers: 20000
  attacked_parameter: clip_model.vision_model.encoder.layers.0.self_attn.q_proj.lora_A
  token_reduction: cls
defense:
  name: none
