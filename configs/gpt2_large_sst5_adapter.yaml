model_type: gpt2_adapter
architecture: gpt2
model_path: ./checkpoints/gpt2-large
dataset_path: ./data/huggingface/sst5
dataset_name: sst5

# Match the BERT large-batch variant: synchronous one-batch FedSGD with 32
# examples per client and communication round.
total_users: 30
sample_users: 30
num_global_iters: 300
batch_size: 32
eval_batch_size: 8
# Use the same constant client learning rate as BERT for all 300 rounds.
learning_rate: 0.001
learning_rate_decay: 1.0
learning_rate_decay_interval: 50
eval_interval: 5
aggregation_weighting: uniform

max_length: 128
adapter:
  reduction: 2
  activation: relu
  classifier_dropout: 0.0
  gradient_checkpointing: true
  zero_init_up: true

optimization:
  client_optimizer: sgd
  momentum: 0.0
  weight_decay: 0.0
  max_grad_norm: 1.0

gpu: 0
require_cuda: true
seed: 42
save_models: false
results_dir: ./results

audit:
  enabled: true
  strict: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
  target_client_id: 0
  audit_client_ids: [0]
  candidate_sampling: balanced_holdout
  # Keep output inference bounded; cosine gradients are always streamed one
  # sample at a time and are never retained as a candidate-by-parameter matrix.
  audit_batch_size: 4
  audit_interval: 10
  attack_audit_intervals:
    loss_series: 10
    avg_cosine: 10
    fedmia_loss: 10
    fedmia_cosine: 10
  signal_storage: compact
  low_fpr_max_members: 100
  low_fpr_max_nonmembers: 100

projres:
  enabled: true
  evaluation_round: last
  threshold: 0.01
  # Audit the complete observed FedSGD batch.
  max_candidates: 32
  min_nonmembers: 100
  max_nonmembers: 1000
  token_reduction: auto
