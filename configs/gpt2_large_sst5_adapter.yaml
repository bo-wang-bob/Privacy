model_type: gpt2_adapter
architecture: gpt2
model_path: ./checkpoints/gpt2-large
dataset_path: ./data/huggingface/sst5
dataset_name: sst5

# Match BERT and the paper protocol: synchronous one-batch FedSGD with 16
# examples per client and communication round.
total_users: 30
sample_users: 30
num_global_iters: 500
batch_size: 16
eval_batch_size: 16
# Keep GPT2-Large on its independently tuned constant learning rate.
learning_rate: 0.001
learning_rate_decay: 1.0
learning_rate_decay_interval: 50
eval_interval: 50
aggregation_weighting: uniform

max_length: 128
adapter:
  reduction: 2
  activation: relu
  classifier_dropout: 0.0
  gradient_checkpointing: true
  # Keep the inserted residual branch exactly zero at initialization: the down
  # projection uses GPT2's N(0, 0.02^2) initializer while the up projection and
  # both biases start at zero.
  zero_init_up: true

optimization:
  client_optimizer: sgd
  momentum: 0.0
  weight_decay: 0.0
  # Zero disables gradient clipping and preserves the raw one-batch SGD update.
  max_grad_norm: 0.0

gpu: 0
require_cuda: true
seed: 42
save_models: false
results_dir: ./results

audit:
  enabled: true
  strict: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - gradient_diff
    - score_diff
    - score_ratio
    - fta
    - projres
  target_client_id: 0
  audit_client_ids: [0]
  candidate_sampling: balanced_global_holdout
  nonmember_to_member_ratio: 10
  # Use the same real one-batch membership view as BERT.
  exact_batch_membership_attacks:
    - blackbox_loss
    - grad_cosine
    - gradient_diff
    - projres
    - score_diff
    - score_ratio
  exact_batch_nonmember_to_member_ratio: 10
  paper_balanced_evaluation_size: 100
  # Match training/evaluation batching for candidate forward passes. Cosine
  # gradients remain streamed one sample at a time.
  audit_batch_size: 16
  # Collect every configured attack after 50, 100, ..., 500 completed rounds.
  audit_interval: 50
  attack_audit_intervals:
    blackbox_loss: 50
    loss_series: 50
    grad_cosine: 50
    avg_cosine: 50
    fedmia_loss: 50
    gradient_diff: 50
    score_diff: 50
    score_ratio: 50
    fta: 50
    projres: 50
  score_ratio_damping: 1.0e-6
  fta_measurement: confidence
  signal_storage: compact
  low_fpr_min_nonmembers: 1000
  low_fpr_max_members: 100
  low_fpr_max_nonmembers: 1000

projres:
  enabled: true
  # Audit real target-client uploads after rounds 50, 100, ..., 500.
  evaluation_interval: 50
  decision_mode: ranking
  threshold: null
  # Shared 16-member/160-nonmember exact-batch view.
  max_candidates: 16
  min_nonmembers: 160
  max_nonmembers: 160
  token_reduction: auto
