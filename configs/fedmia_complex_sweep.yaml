name: fedmia_complex_tpr1
base_config: configs/fedmia_prompt_benchmark.yaml
results_root: results/fedmia_complex_tpr1
# Jobs run sequentially. Before each job the launcher chooses the least busy
# visible GPU with the most free memory from this candidate set.
gpus: [0, 1]
minimum_free_memory_mb: 7000

# Three independent data partitions and training initializations.
seeds: [42, 1337, 2027]
target_client_ids: [0]

# Shared settings for every job in the grid.
common:
  train_mode: centralized
  dataset_name: cifar100
  data_root: /root/datasets
  cache_dir: /root/DistributedFL/checkpoints/clip-vit-base-patch32
  aggregator: fedavg
  require_cuda: true
  num_global_iters: 20
  local_epochs: 2
  total_users: 10
  sample_users: 10
  fpl_shots: 16
  batch_size: 16
  eval_batch_size: 64
  learning_rate: 0.001
  dirichlet_alpha: 0.1
  n_ctx: 16
  class_specific_ctx: false
  eval_interval: 5
  save_models: false
  audit:
    enabled: true
    strict: true
    audit_view: protocol_plus_released_prompts
    target_client_id: 0
    ensure_target_participation: true
    attacks:
      - blackbox_loss
      - loss_series
      - grad_cosine
      - avg_cosine
      - fedmia_loss
      - fedmia_cosine
      - nasr_passive
      - rmia
      - quantile_mia
    # Asymmetric candidates provide low-FPR resolution without duplicating
    # scarce target-client members. RMIA, Quantile-MIA, and Nasr-Passive use
    # about half the non-members for calibration, leaving about 1024 for
    # evaluation: one false positive is then 0.09765625% FPR.
    max_member_samples: 128
    max_nonmember_samples: 2048
    audit_interval: 1
    calibration_fraction: 0.5
    match_candidate_labels: true
    fedmia_baseline_single_round: last
    fedmia_loss_aggregation: mean
    fedmia_cosine_aggregation: mean

# Cartesian grids are expanded per defense and repeated for every seed.
# Total: 26 settings x 3 seeds = 78 runs.
defenses:
  - name: none

  - name: perturb
    fixed:
      perturb_clip_norm: 1.0
    grid:
      perturb_noise_std: [0.01, 0.05, 0.1]

  - name: sparse
    grid:
      sparse_ratio: [0.5, 0.9, 0.99]

  - name: mixup
    grid:
      mixup_alpha: [0.1, 1.0, 10.0]

  - name: sampling
    grid:
      sampling_ratio: [0.25, 0.5, 0.75]

  - name: data_aug
    fixed:
      data_aug_flip_probability: 0.5
      data_aug_color_jitter: 0.1
    grid:
      data_aug_strength: [0.05, 0.1, 0.2]

  - name: data_aug_sampling
    fixed:
      data_aug_flip_probability: 0.5
      data_aug_color_jitter: 0.1
    grid:
      sampling_ratio: [0.25, 0.5]
      data_aug_strength: [0.05, 0.1]

  - name: prompt_dp
    fixed:
      dp_max_grad_norm: 1.0
      dp_noise_multiplier: 0.5

  - name: prompt_dp
    fixed:
      dp_max_grad_norm: 0.5
      dp_noise_multiplier: 1.0

  - name: prompt_dp
    fixed:
      dp_max_grad_norm: 0.5
      dp_noise_multiplier: 2.0

  - name: hamp
    fixed:
      hamp_true_probability: 0.6
      hamp_entropy_weight: 0.05
    grid:
      hamp_output_temperature: [2.0, 4.0, 8.0]
