# Single-run, paper-aligned PromptFL experiment for the PromptMIA adaptation.
# This keeps the training setup aligned with federated_prompt_paper.yaml while
# enabling only PromptMIA against target client 0.
train_mode: centralized
dataset_name: caltech101
data_root: ./data
cache_dir: ./checkpoints/clip-vit-base-patch32
require_cuda: true
gpu: 0
seed: 42

partition_mode: iid
use_full_dataset: true
fpl_shots: null
total_users: 10
sample_users: 10
num_global_iters: 100
local_epochs: 1
learning_rate: 0.0001
batch_size: 16
eval_batch_size: 64
eval_interval: 5

n_ctx: 16
class_specific_ctx: false
aggregator: promptfl
promptfl: {}

model_load_path: null
save_models: false
results_dir: results/promptmia_promptfl_real

audit:
  enabled: true
  audit_view: protocol_plus_released_prompts
  strict: true
  attacks: [promptmia]
  target_client_id: 0
  ensure_target_participation: true
  candidate_sampling: legacy
  match_candidate_labels: true
  max_samples_per_group: 128
  promptmia_max_samples: 256
  promptmia_keys: 8
  promptmia_delta_min: 0.02
  promptmia_similarity_span: 0.05
  signal_storage: compact

defense:
  name: none
