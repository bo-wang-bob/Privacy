train_mode: centralized
dataset_name: caltech101
batch_size: 16
eval_batch_size: 64
learning_rate: 0.001
num_global_iters: 20
local_epochs: 2
total_users: 10
sample_users: 10
aggregator: fedavg
dirichlet_alpha: 0.1
gpu: 0
seed: 42
fpl_shots: 16
cache_dir: ./checkpoints/clip-vit-base-patch32
n_ctx: 32
class_specific_ctx: false
model_load_path: null
save_models: false
eval_interval: 5
results_dir: ./results

audit:
  enabled: true
  strict: true
  target_client_id: 0
  ensure_target_participation: true
  attacks:
    - nasr_passive
    - nasr_active
    - fedmia_loss
    - fedmia_cosine
    - transfer_representation
    - codepoison
  max_samples_per_group: 32
  audit_interval: 2
  calibration_fraction: 0.5
  active_max_samples: 16
  active_ascent_steps: 1
  active_ascent_lr: 0.01
  codepoison_weight: 1.0
  synthetic_mean: 0.0
  synthetic_std: 0.1
