name: fedmia_prompt_methods_fewshot
base_config: configs/federated_prompt_paper.yaml
results_root: results/fedmia_prompt_methods_fewshot

# One model trains on one GPU. Raise jobs explicitly to run concurrent jobs.
gpus: [0]
minimum_free_memory_mb: 7000
jobs: 1

seeds: [42, 1337, 2027]
target_client_ids: [0]

methods:
  - promptfl
  - fedotp
  - fedpgp

# Few-shot means a single system-wide pool of at most 16 training examples per
# class. That pool is subsequently divided among clients by Dirichlet sampling.
datasets:
  - name: caltech101
    overrides:
      dataset_name: caltech101
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: oxfordpets
    overrides:
      dataset_name: oxfordpets
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: flowers
    overrides:
      dataset_name: flowers
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: food101
    overrides:
      dataset_name: food101
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: cifar100
    overrides:
      dataset_name: cifar100
      total_users: 10
      sample_users: 10
      num_global_iters: 50

common:
  data_root: ./data
  cache_dir: ./checkpoints/clip-vit-base-patch32
  require_cuda: true
  partition_mode: dirichlet
  use_full_dataset: false
  fpl_shots: 16
  dirichlet_alpha: 0.1
  local_epochs: 2
  learning_rate: 0.0001
  batch_size: 16
  eval_batch_size: 64
  eval_interval: 5
  n_ctx: 16
  class_specific_ctx: false
  save_models: false
  audit:
    enabled: true
    strict: true
    audit_view: protocol_plus_released_prompts
    attacks:
      - fedmia_loss
      - fedmia_cosine
    target_client_id: 0
    audit_client_ids: all
    # A very heterogeneous few-shot split can leave a client without two
    # same-label train/test pairs. Keep all eligible clients and record skips.
    allow_partial_client_audit: true
    ensure_target_participation: true
    audit_interval: 1
    audit_batch_size: 16
    max_member_samples: 128
    max_nonmember_samples: 128
    match_candidate_labels: true
    signal_storage: compact
    fedmia_tail: upper
    fedmia_loss_aggregation: mean
    fedmia_cosine_aggregation: mean
    training_health_check: true
    fedmia_signal_health_check: true
  defense:
    name: none

defenses:
  - name: none
