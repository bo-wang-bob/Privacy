name: fedmia_prompt_methods_fewshot
base_config: configs/federated_prompt_paper.yaml
results_root: results/fedmia_prompt_methods_fewshot

# One model trains on one GPU. Raise jobs explicitly to run concurrent jobs.
gpus: [0]
minimum_free_memory_mb: 7000
jobs: 1

seeds: [42, 1337, 2027]
target_client_ids: [0]

methods:
  - promptfl
  - name: fedotp
    overrides:
      audit:
        # FedMIA-IV assumes cosine-classifier logits T x; FedOTP uses UOT logits.
        attacks:
          - loss_series
          - grad_cosine
          - avg_cosine
          - fedmia_loss
          - fedmia_cosine
          - fedmia_text
          - nasr_passive
          - transfer_representation
          - rmia
          - quantile_mia
  - fedpgp

# Few-shot means a single system-wide pool of at most 16 training examples per
# class. That pool is subsequently divided among clients by Dirichlet sampling.
datasets:
  - name: caltech101
    overrides:
      dataset_name: caltech101
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: oxfordpets
    overrides:
      dataset_name: oxfordpets
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: flowers
    overrides:
      dataset_name: flowers
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: food101
    overrides:
      dataset_name: food101
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: cifar100
    overrides:
      dataset_name: cifar100
      total_users: 10
      sample_users: 10
      num_global_iters: 50

common:
  data_root: ./data
  cache_dir: ./checkpoints/clip-vit-base-patch32
  require_cuda: true
  partition_mode: dirichlet
  use_full_dataset: false
  fpl_shots: 16
  dirichlet_alpha: 0.1
  local_epochs: 5
  learning_rate: 0.005
  batch_size: 16
  eval_batch_size: 64
  eval_interval: 5
  n_ctx: 16
  class_specific_ctx: false
  save_models: false
  audit:
    enabled: true
    strict: true
    audit_view: protocol_plus_released_prompts
    attacks:
      - loss_series
      - grad_cosine
      - avg_cosine
      - fedmia_loss
      - fedmia_cosine
      - fedmia_text
      - fedmia_text_gradient
      - nasr_passive
      - transfer_representation
      - rmia
      - quantile_mia
    target_client_id: 0
    audit_client_ids: all
    # A very heterogeneous few-shot split can leave a client without two
    # same-label train/test pairs. Keep all eligible clients and record skips.
    allow_partial_client_audit: true
    ensure_target_participation: true
    audit_interval: 1
    audit_batch_size: 16
    # 16-shot datasets in this sweep contain at most about 1.6K training
    # examples in total, so these caps retain every target-client member.
    max_member_samples: 2048
    max_nonmember_samples: 2048
    # Target-client training members versus an equally sized mix of independent
    # test samples and other-client training samples.
    candidate_sampling: fedmia_mix
    nonmember_to_member_ratio: 1.0
    match_candidate_labels: false
    signal_storage: compact
    fedmia_tail: upper
    fedmia_loss_aggregation: mean
    fedmia_cosine_aggregation: mean
    fedmia_text_aggregation: mean
    fedmia_text_tail: upper
    fedmia_text_probe_norm: 0.001
    fedmia_text_candidate_batch_size: 8
    fedmia_text_gradient_aggregation: mean
    fedmia_text_gradient_tail: upper
    fedmia_text_gradient_project_tangent: false
    calibration_fraction: 0.5
    auxiliary_fraction: 0.5
    qmia_epochs: 200
    qmia_learning_rate: 0.01
    training_health_check: true
    fedmia_signal_health_check: true
  defense:
    name: none

defenses:
  - name: none
