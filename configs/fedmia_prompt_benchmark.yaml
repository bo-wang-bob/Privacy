train_mode: centralized
dataset_name: cifar100
data_root: ./data
batch_size: 16
eval_batch_size: 64
learning_rate: 0.001
num_global_iters: 20
local_epochs: 2
total_users: 10
sample_users: 10
aggregator: fedavg
dirichlet_alpha: 0.1
gpu: 0
require_cuda: true
seed: 42
fpl_shots: 16
cache_dir: ./checkpoints/clip-vit-base-patch32
n_ctx: 16
class_specific_ctx: false
model_load_path: null
save_models: false
eval_interval: 5
results_dir: ./results

audit:
  enabled: true
  audit_view: protocol_plus_released_prompts
  strict: true
  target_client_id: 0
  ensure_target_participation: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
  max_samples_per_group: 64
  audit_interval: 1
  calibration_fraction: 0.5
  match_candidate_labels: true
  fedmia_baseline_single_round: last
  fedmia_loss_aggregation: mean
  fedmia_cosine_aggregation: mean

defense:
  name: none
  # FedMIA Appendix A.2 evaluates noise std in [0.01, 0.5].
  perturb_clip_norm: 1.0
  perturb_noise_std: 0.05
  # The paper evaluates sparsified fractions from 0.1 to 0.99.
  sparse_ratio: 0.9
  # The original sweep spans a very wide positive range; 1.0 is uniform MixUp.
  mixup_alpha: 1.0
  # The paper evaluates retained data fractions from 0.1 to 1.0.
  sampling_ratio: 0.5
  data_aug_strength: 0.1
  data_aug_flip_probability: 0.5
  data_aug_color_jitter: 0.1
