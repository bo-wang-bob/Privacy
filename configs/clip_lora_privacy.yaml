model_type: clip_lora
dataset_name: caltech101
data_root: ./data
cache_dir: ./checkpoints/clip-vit-base-patch32
require_cuda: true
partition_mode: iid
dirichlet_alpha: 0.1
use_full_dataset: false
fpl_shots: 16

batch_size: 32
eval_batch_size: 128
learning_rate: 0.0002
learning_rate_decay: 1.0
num_global_iters: 300
local_epochs: 1
total_users: 10
sample_users: 10
aggregator: fedavg
aggregation_weighting: uniform
fedavg:
  client_optimizer: adamw
  weight_decay: 0.01

clip_lora:
  # Paper-style baseline: LoRA on Q/K/V in every attention block of both
  # CLIP encoders. Only A/B factors are trainable and communicated.
  encoder: both
  target_modules: [q, k, v]
  layers: all
  rank: 2
  alpha: 1.0
  dropout: 0.25
  scaling: sqrt_rank
  template: null

eval_interval: 5
save_models: false
audit:
  enabled: false
projres:
  enabled: false
defense:
  name: none
