model_type: bert_adapter
architecture: bert
model_path: ./checkpoints/bert-base-uncased
dataset_path: ./data/huggingface/cola
dataset_name: cola

# Use synchronous FedSGD with 30 IID clients and one local batch of 16 examples
# per communication round, matching Deng et al.'s batch-size-16 protocol.
total_users: 30
sample_users: 30
num_global_iters: 750
batch_size: 16
eval_batch_size: 32
# CoLA was still improving at round 500 with 5e-3. Keep that rate through 500
# completed rounds, then halve it for the final 250-round refinement phase.
learning_rate: 0.005
learning_rate_decay: 0.5
learning_rate_decay_interval: 500
eval_interval: 50
aggregation_weighting: uniform

max_length: 128
adapter:
  reduction: 2
  activation: relu
  classifier_dropout: 0.0
  gradient_checkpointing: false
  zero_init_up: false

optimization:
  client_optimizer: sgd
  momentum: 0.0
  weight_decay: 0.0
  max_grad_norm: 0.0

gpu: 0
require_cuda: false
seed: 42
save_models: false
results_dir: ./results

audit:
  enabled: true
  strict: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
  target_client_id: 0
  audit_client_ids: [0]
  candidate_sampling: balanced_holdout
  audit_batch_size: 16
  audit_interval: 50
  attack_audit_intervals:
    blackbox_loss: 50
    loss_series: 50
    grad_cosine: 50
    avg_cosine: 50
    fedmia_loss: 50
    fedmia_cosine: 50
  signal_storage: compact
  low_fpr_max_members: 100
  low_fpr_max_nonmembers: 100

projres:
  enabled: true
  evaluation_interval: 50
  threshold: 0.01
  max_candidates: 16
  min_nonmembers: 100
  max_nonmembers: 1000
  token_reduction: auto
