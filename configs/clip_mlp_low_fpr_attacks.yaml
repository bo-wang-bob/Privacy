model_type: clip_mlp
train_mode: centralized
dataset_name: caltech101
data_root: ./data
batch_size: 32
eval_batch_size: 512
learning_rate: 0.001
learning_rate_decay: 0.99
learning_rate_decay_interval: 5
num_global_iters: 20
local_epochs: 2
total_users: 10
sample_users: 10
aggregator: fedavg

clip_mlp:
  hidden_dim: 512
  dropout: 0.0
  normalize_features: false
  # Encode every image once at startup; all rounds and evaluations use vectors.
  precompute_features: true
  # Keep raw-image CLIP encoding separate from the larger cached-vector batches.
  precompute_batch_size: 64

# Use an IID client split so membership is not confounded by client label skew.
partition_mode: iid
# Retained for config/CLI compatibility; ignored when partition_mode=iid.
dirichlet_alpha: 0.1
use_full_dataset: true
fpl_shots: null
gpu: 0
seed: 42
cache_dir: ./checkpoints/clip-vit-base-patch32
model_load_path: null
save_models: false
eval_interval: 5
results_dir: ./results

audit:
  enabled: true
  strict: true
  audit_view: protocol_plus_released_prompts
  target_client_id: 0
  ensure_target_participation: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
  # Build the candidate pool from every target-client member and every disjoint
  # non-member, then apply deterministic class-stratified caps when needed.
  candidate_sampling: low_fpr_full
  low_fpr_min_nonmembers: 1000
  low_fpr_max_members: 5000
  low_fpr_max_nonmembers: 20000
  match_candidate_labels: false
  audit_batch_size: 512
  audit_interval: 5
  low_fpr_gradient_batch_size: 16
  signal_storage: compact
  fedmia_tail: upper
  fedmia_tail_calibration_fraction: 0.25
  training_health_check: true

defense:
  name: none
