version: 1

# Running without selectors keeps the former unified CLIP entry's scope.
defaults:
  models: [clip_mlp, clip_adapter, clip_lora]

# Preserve model data and learning rates; FedAvg uses a shorter 100-round run.
method_overrides:
  fedsgd:
    aggregator: fedsgd
    local_epochs: 1
    aggregation_weighting: uniform
  fedavg:
    aggregator: fedavg
    num_global_iters: 100
    local_epochs: 1
    aggregation_weighting: sample_count
    models:
      clip_mlp: &clip_fedavg_audit
        audit:
          attack_audit_intervals:
            {blackbox_loss: 50, loss_series: 10, grad_cosine: 50, avg_cosine: 10,
             fedmia_loss: 10, fedmia_cosine: 10, gradient_diff: 50,
             score_diff: 50, score_ratio: 50, fta: 10, projres: 50}
        projres:
          evaluation_interval: 50
      clip_adapter: *clip_fedavg_audit
      clip_lora: *clip_fedavg_audit

attacks:
  all: &all_attacks
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
    - gradient_diff
    - score_diff
    - score_ratio
    - fta
    - projres
  exact_batch: &exact_batch_attacks
    - blackbox_loss
    - grad_cosine
    - gradient_diff
    - score_diff
    - score_ratio
    - projres

aliases:
  models:
    resnet: resnet18
    mlp: clip_mlp
    adapter: clip_adapter
    visual_adapter: clip_adapter
    visual-adapter: clip_adapter
    clip-adapter: clip_adapter
    lora: clip_lora
    clip-lora: clip_lora
    bert: bert_adapter
    bert-base: bert_adapter
    bert-lora: bert_lora
    gpt2: gpt2_adapter
    gpt: gpt2_adapter
  datasets:
    flowers102: flowers
    food: food101
    sst-5: sst5
  defenses:
    off: none
    local_dp: local_client_dp
    client_dp: local_client_dp

models:
  resnet18:
    config: configs/models/resnet18.yaml
    runner: vision
    supported_methods: [fedavg]
    datasets: [cifar100]
    default_datasets: [cifar100]
    supported_attacks: [fedmia_loss]
    default_attacks: [fedmia_loss]
    supported_defenses: [none, record_dp]
    default_defenses: [none]
    default_seeds: [1]

  clip_mlp:
    config: configs/models/clip_mlp.yaml
    runner: vision
    supported_methods: [fedsgd, fedavg]
    datasets: &clip_datasets [caltech101, oxfordpets, flowers, food101, cifar100]
    default_datasets: &clip_default_datasets [cifar100, food101]
    supported_attacks: *all_attacks
    default_attacks: *all_attacks
    supported_defenses: &clip_defenses [none, www, cofedmid]
    default_defenses: [none]
    default_seeds: [42]

  clip_adapter:
    config: configs/models/clip_adapter.yaml
    runner: vision
    supported_methods: [fedsgd, fedavg]
    datasets: *clip_datasets
    default_datasets: *clip_default_datasets
    supported_attacks: *all_attacks
    default_attacks: *all_attacks
    supported_defenses: [none, www, cofedmid, risk_synthesis]
    default_defenses: [none]
    default_seeds: [42]

  clip_lora:
    config: configs/models/clip_lora.yaml
    runner: vision
    supported_methods: [fedsgd, fedavg]
    datasets: *clip_datasets
    default_datasets: *clip_default_datasets
    supported_attacks: *all_attacks
    default_attacks: *all_attacks
    supported_defenses: [none, www, cofedmid, risk_synthesis]
    default_defenses: [none]
    default_seeds: [42]

  bert_adapter:
    config: configs/models/bert_adapter.yaml
    runner: text
    supported_methods: [fedsgd, fedavg]
    datasets: &text_datasets [sst5, cola, imdb]
    default_datasets: *text_datasets
    supported_attacks: *all_attacks
    default_attacks: *all_attacks
    supported_defenses: [none, www, cofedmid, record_dp, local_client_dp]
    default_defenses: [www]
    default_seeds: [42]

  bert_lora:
    config: configs/models/bert_lora.yaml
    runner: text
    supported_methods: [fedsgd, fedavg]
    datasets: *text_datasets
    default_datasets: [cola]
    supported_attacks: *all_attacks
    default_attacks: *all_attacks
    supported_defenses: [none, www, cofedmid]
    default_defenses: [none]
    default_seeds: [42]

  gpt2_adapter:
    config: configs/models/gpt2_adapter.yaml
    runner: text
    supported_methods: [fedsgd, fedavg]
    datasets: *text_datasets
    default_datasets: *text_datasets
    supported_attacks: *all_attacks
    default_attacks: *all_attacks
    supported_defenses: [none, cofedmid]
    default_defenses: [none]
    default_seeds: [42]

# These are deep-merged after the model baseline. Model-specific branches take
# precedence over the common branch. Only combinations listed under each
# model's supported_defenses are expanded by the ultimate runner.
defense_overrides:
  cofedmid:
    common:
      defense:
        name: cofedmid
        cofedmid_clients: all
        cofedmid_partition: true
        cofedmid_compensation: true
        cofedmid_perturbation: true
        cofedmid_max_class_ratio: 0.5
        cofedmid_min_class_ratio: 0.2
        cofedmid_coverage: strict
        cofedmid_init_round: 10
        cofedmid_intervals: 10
        cofedmid_recycle_ratio: 0.05
        cofedmid_entropy_weight: 0.005
        cofedmid_exp3_gamma: 0.2
        cofedmid_exp3_learning_rate: 0.3
        cofedmid_reward_history: 20
        cofedmid_noise_std: 0.01
        cofedmid_noise_space: parameter
        cofedmid_perturb_ratio: 0.2
        cofedmid_reproducible_noise: false
        cofedmid_validation_fraction: 0.1

  none:
    common:
      defense:
        name: none

  risk_synthesis:
    common:
      defense:
        name: risk_synthesis
        target_epsilon: null
        delta: null
        noise_multiplier: 0.0
        release_private_diagnostics: false
        synthesis:
          replacement_policy: all
          replacement_fraction: 1.0
          noise_scale: 0.1
          class_rank: 5
          global_distribution: generate
          center_source: global_class
          min_class_samples: 3
          attempts: 2
          margin_tolerance: 0.02
          center_weighting: uniform
          mode: risk
          risk_history: none
          candidate_selection: first_semantic
          views_per_record: 1
          semantic_filter: true
          warmup_rounds: 0

  www:
    common:
      defense:
        name: www
        target_epsilon: null
        max_grad_norm: null
        delta: null
        noise_multiplier: 0.0
        www_tail_fraction: 0.8
        www_tail_basis: actual_batch
        www_beta_alpha: null
        www_beta_beta: null
        www_regularization_weight: 1.0
        grad_sample_backend: auto
        microbatch_size: 4
        www_analysis_interval: 1
        www_analysis_timing: pre_update
        www_feature_statistics: false
        www_record_diagnostics: false
        www_validation_top_fraction: 0.2
        adjacency: null
        sampling: shuffled_batches
        accountant: null
        reproducible_dp_noise: false
        release_private_diagnostics: false

  record_dp:
    models:
      resnet18:
        resnet18:
          paper_protocol: false
        audit:
          www_candidate_scoring: false
        defense:
          name: record_dp
          adjacency: add_remove
          sampling: poisson
          accountant: rdp
          max_grad_norm: 1.0
          target_epsilon: 3.0
          delta: 1.0e-5
          noise_multiplier: auto
          grad_sample_backend: vmap
          microbatch_size: 4
          reproducible_noise: false
          release_private_diagnostics: false
      bert_adapter:
        defense:
          name: record_dp
          adjacency: add_remove
          sampling: poisson
          accountant: rdp
          max_grad_norm: 1.0
          target_epsilon: 3.0
          delta: 1.0e-5
          noise_multiplier: auto
          grad_sample_backend: auto
          microbatch_size: 4
          reproducible_noise: false
          release_private_diagnostics: false
        projres:
          max_candidates: 0
          min_nonmembers: 0
          max_nonmembers: 0

  local_client_dp:
    models:
      bert_adapter:
        defense:
          name: local_client_dp
          privacy_unit: client
          adjacency: add_remove
          sampling: full_participation
          accountant: rdp
          max_update_norm: 1.0
          target_epsilon: 3.0
          delta: 1.0e-5
          noise_multiplier: auto
          reproducible_noise: false
          release_private_diagnostics: false
