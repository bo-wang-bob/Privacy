model_type: visual_adapter
train_mode: centralized
dataset_name: caltech101
data_root: ./data
batch_size: 128
eval_batch_size: 512
learning_rate: 0.001
num_global_iters: 50
local_epochs: 5
total_users: 10
sample_users: 10
aggregator: fedavg

visual_adapter:
  feature_dim: 512
  reduction: 4
  alpha: 0.2
  output_relu: true
  precompute_features: true
  # Keep raw-image CLIP encoding separate from the larger cached-vector batches.
  precompute_batch_size: 64
  template: null

partition_mode: dirichlet
dirichlet_alpha: 0.1
use_full_dataset: false
fpl_shots: 16
gpu: 0
seed: 42
cache_dir: ./checkpoints/clip-vit-base-patch32
model_load_path: null
save_models: false
eval_interval: 5
results_dir: ./results

audit:
  enabled: true
  strict: true
  audit_view: protocol_plus_released_prompts
  target_client_id: 0
  ensure_target_participation: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
  candidate_sampling: low_fpr_full
  low_fpr_min_nonmembers: 1000
  match_candidate_labels: false
  audit_batch_size: 512
  audit_interval: 5
  low_fpr_gradient_batch_size: 16
  signal_storage: compact
  fedmia_tail: upper
  fedmia_tail_calibration_fraction: 0.25
  training_health_check: true

defense:
  name: none
