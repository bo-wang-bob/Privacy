# Record-level DP-SGD on the full CIFAR-100 IID ResNet18 benchmark.
model_type: resnet18
dataset_name: cifar100
data_root: ./data
batch_size: 100
eval_batch_size: 100
learning_rate: 0.1
learning_rate_decay: 0.99
learning_rate_decay_interval: 1
num_global_iters: 300
local_epochs: 1
total_users: 10
sample_users: 10
aggregator: fedavg
aggregation_weighting: sample_count

fedavg:
  client_optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0005

resnet18:
  # The architecture and optimizer retain the FedMIA setting, while Poisson
  # record sampling and DP-SGD intentionally modify its training stream.
  paper_protocol: false
  iid_split: random_equal
  normalization: fedmia_cifar100
  normalization_layer: groupnorm_32

partition_mode: iid
dirichlet_alpha: 0.1
use_full_dataset: true
fpl_shots: null
gpu: 0
require_cuda: true
seed: 1
model_load_path: null
save_models: false
eval_interval: 10
results_dir: ./results

audit:
  enabled: true
  strict: true
  audit_view: protocol_plus_released_prompts
  target_client_id: 0
  ensure_target_participation: true
  attacks:
    - fedmia_loss
  candidate_sampling: fedmia_mix
  max_member_samples: 5000
  max_nonmember_samples: 10000
  nonmember_to_member_ratio: 2.0
  match_candidate_labels: false
  audit_batch_size: 512
  audit_interval: 10
  attack_audit_intervals:
    fedmia_loss: 10
  fedmia_loss_aggregation: mean
  fedmia_loss_tail: upper
  iclr_candidate_scoring: false
  signal_storage: compact
  training_health_check: true
  fedmia_signal_health_check: true

defense:
  name: record_dp
  adjacency: add_remove
  sampling: poisson
  accountant: rdp
  max_grad_norm: 1.0
  target_epsilon: 3.0
  delta: 1.0e-5
  noise_multiplier: auto
  grad_sample_backend: vmap
  # Per-sample gradients are materialized only for this many records at once.
  microbatch_size: 4
  reproducible_noise: false
  release_private_diagnostics: false

projres:
  enabled: false
