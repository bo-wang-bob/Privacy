model_type: bert_lora
architecture: bert
model_path: ./checkpoints/bert-base-uncased
dataset_name: sst5
dataset_path: ./data/huggingface/sst5

total_users: 30
sample_users: 30
num_global_iters: 750
batch_size: 16
eval_batch_size: 32
learning_rate: 0.01
learning_rate_decay: 1.0
learning_rate_decay_interval: 50
eval_interval: 50
aggregation_weighting: uniform
max_length: 128

lora:
  target_modules: [query, value]
  layers: all
  rank: 8
  alpha: 16.0
  dropout: 0.1
  scaling: rank
  classifier_dropout: 0.1
  gradient_checkpointing: false
optimization: {client_optimizer: sgd, momentum: 0.0, weight_decay: 0.0,
               max_grad_norm: 0.0}

gpu: 0
require_cuda: false
seed: 42
save_models: false
results_dir: ./results

audit:
  enabled: true
  strict: true
  attacks:
    [blackbox_loss, loss_series, grad_cosine, avg_cosine, fedmia_loss,
     fedmia_cosine, gradient_diff, score_diff, score_ratio, fta, projres]
  target_client_id: 0
  audit_client_ids: [0]
  candidate_sampling: balanced_global_holdout
  require_full_target_train_members: true
  nonmember_to_member_ratio: 1
  exact_batch_membership_attacks:
    [blackbox_loss, grad_cosine, gradient_diff, score_diff, score_ratio, projres]
  exact_batch_nonmember_to_member_ratio: 10
  paper_balanced_evaluation_size: 100
  audit_batch_size: 16
  audit_interval: 50
  attack_audit_intervals:
    {blackbox_loss: 50, loss_series: 10, grad_cosine: 50, avg_cosine: 10,
     fedmia_loss: 10, fedmia_cosine: 10, gradient_diff: 50,
     score_diff: 50, score_ratio: 50, fta: 10, projres: 50}
  score_ratio_damping: 1.0e-6
  fta_measurement: confidence
  signal_storage: compact
  low_fpr_min_nonmembers: 2
  low_fpr_max_members: 0
  low_fpr_max_nonmembers: 0

defense: {name: none}
projres:
  enabled: true
  evaluation_interval: 50
  decision_mode: ranking
  threshold: null
  attacked_parameter: backbone.encoder.layer.0.attention.self.query.lora_A
  max_candidates: 16
  min_nonmembers: 160
  max_nonmembers: 160
  token_reduction: mean
