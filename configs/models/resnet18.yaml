# FedMIA paper setting: ResNet18 on the full CIFAR-100 IID split.
model_type: resnet18
dataset_name: cifar100
data_root: ./data

total_users: 10
sample_users: 10
num_global_iters: 300
batch_size: 100
eval_batch_size: 100
local_epochs: 1
learning_rate: 0.1
learning_rate_decay: 0.99
learning_rate_decay_interval: 1
eval_interval: 10
aggregator: fedavg
aggregation_weighting: sample_count
partition_mode: iid
dirichlet_alpha: 0.1
use_full_dataset: true
fpl_shots: null

fedavg: {client_optimizer: sgd, momentum: 0.9, weight_decay: 0.0005}
resnet18:
  paper_protocol: true
  iid_split: random_equal
  normalization: fedmia_cifar100
  normalization_layer: groupnorm_32

gpu: 0
require_cuda: true
seed: 1
save_models: false
results_dir: ./results

audit:
  enabled: true
  strict: true
  audit_view: protocol_plus_released_prompts
  target_client_id: 0
  ensure_target_participation: true
  attacks: [fedmia_loss]
  candidate_sampling: fedmia_mix
  max_member_samples: 5000
  max_nonmember_samples: 10000
  nonmember_to_member_ratio: 2.0
  match_candidate_labels: false
  audit_batch_size: 512
  audit_interval: 10
  attack_audit_intervals: {fedmia_loss: 10}
  fedmia_loss_aggregation: mean
  fedmia_loss_tail: upper
  iclr_candidate_scoring: true
  signal_storage: compact
  training_health_check: true
  fedmia_signal_health_check: true

defense: {name: none}
projres: {enabled: false}
