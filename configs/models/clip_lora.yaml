model_type: clip_lora
dataset_name: cifar100
data_root: ./data
cache_dir: ./checkpoints/clip-vit-base-patch32

total_users: 10
sample_users: 10
num_global_iters: 300
batch_size: 32
eval_batch_size: 128
local_epochs: 1
learning_rate: 0.01
learning_rate_decay: 1.0
eval_interval: 5
aggregator: fedsgd
aggregation_weighting: uniform
partition_mode: iid
dirichlet_alpha: 0.1
# Full training: use_full_dataset: true, fpl_shots: null.
# Both regimes retain the complete independent evaluation split.
use_full_dataset: false
fpl_shots: 16

fedsgd: {client_optimizer: sgd, momentum: 0.0, weight_decay: 0.0}
clip_lora:
  encoder: both
  target_modules: [q, k, v]
  layers: all
  # Increase the LoRA capacity while retaining the existing sqrt-rank scaling.
  rank: 32
  alpha: 1.0
  dropout: 0.0
  scaling: sqrt_rank
  template: null

gpu: 0
require_cuda: true
seed: 42
save_models: false
results_dir: ./results

audit:
  enabled: true
  strict: true
  target_client_id: 0
  audit_client_ids: [0]
  ensure_target_participation: true
  attacks:
    [blackbox_loss, loss_series, grad_cosine, avg_cosine, fedmia_loss,
     fedmia_cosine, gradient_diff, score_diff, score_ratio, fta, projres]
  candidate_sampling: balanced_global_holdout
  require_full_target_train_members: true
  nonmember_to_member_ratio: 1
  exact_batch_membership_attacks:
    [blackbox_loss, grad_cosine, gradient_diff, score_diff, score_ratio, projres]
  exact_batch_nonmember_to_member_ratio: 10
  paper_balanced_evaluation_size: 100
  low_fpr_min_nonmembers: 2
  low_fpr_max_members: 0
  low_fpr_max_nonmembers: 0
  match_candidate_labels: true
  audit_batch_size: 64
  attack_audit_intervals:
    {blackbox_loss: 10, loss_series: 10, grad_cosine: 10, avg_cosine: 10,
     fedmia_loss: 10, fedmia_cosine: 10, gradient_diff: 10,
     score_diff: 10, score_ratio: 10, fta: 10, projres: 10}
  score_ratio_damping: 1.0e-6
  fta_measurement: confidence
  low_fpr_gradient_batch_size: 1
  signal_storage: compact
  fedmia_tail: upper
  fedmia_tail_calibration_fraction: 0.25
  training_health_check: true

defense:
  name: none

projres:
  enabled: true
  evaluation_interval: 10
  decision_mode: ranking
  threshold: null
  max_candidates: 32
  min_nonmembers: 320
  max_nonmembers: 320
  # Resolve the last trained visual Query from the actual backbone.
  attacked_parameter: null
  token_reduction: cls
