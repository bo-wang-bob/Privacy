model_type: bert_adapter
architecture: bert
model_path: ./checkpoints/bert-base-uncased
dataset_path: ./data/huggingface/sst5
dataset_name: sst5

# Use synchronous FedSGD with 30 IID clients and one local batch of 16 examples
# per communication round, matching Deng et al.'s batch-size-16 protocol.
total_users: 30
sample_users: 30
num_global_iters: 500
batch_size: 16
eval_batch_size: 32
# The round-300 decay underperformed the constant-rate baseline, so retain the
# effective 5e-3 step for all 500 completed rounds.
learning_rate: 0.005
learning_rate_decay: 1.0
learning_rate_decay_interval: 50
eval_interval: 50
aggregation_weighting: uniform

max_length: 128
adapter:
  reduction: 2
  activation: relu
  classifier_dropout: 0.0
  gradient_checkpointing: false
  # Keep the inserted residual branch exactly zero at initialization: the down
  # projection uses BERT's N(0, 0.02^2) initializer while the up projection and
  # both biases start at zero. This preserves the pretrained hidden states.
  zero_init_up: true

# Keep real one-batch vanilla-SGD uploads and one scalar learning rate for all
# trainable parameters, so cosine attacks retain their original definition.
optimization:
  client_optimizer: sgd
  momentum: 0.0
  weight_decay: 0.0
  # Zero disables gradient clipping and preserves the raw one-batch SGD update.
  max_grad_norm: 0.0

gpu: 0
require_cuda: false
seed: 42
save_models: false
results_dir: ./results

# Use 100 target-client train members and 1,000 never-trained evaluation
# non-members with an exact 1:10 per-class histogram ratio.
audit:
  enabled: true
  strict: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - gradient_diff
    - score_diff
    - score_ratio
    - fta
    - projres
  target_client_id: 0
  audit_client_ids: [0]
  candidate_sampling: balanced_global_holdout
  nonmember_to_member_ratio: 10
  # These six update-sensitive attacks use the target client's exact upload
  # batch as members at every audit round. Formulas remain unchanged.
  exact_batch_membership_attacks:
    - blackbox_loss
    - grad_cosine
    - gradient_diff
    - projres
    - score_diff
    - score_ratio
  exact_batch_nonmember_to_member_ratio: 10
  # Also report a fixed class-matched 100-member/100-nonmember paper view.
  paper_balanced_evaluation_size: 100
  audit_batch_size: 16
  # Collect every configured attack after 50, 100, ..., 500 completed rounds.
  audit_interval: 50
  attack_audit_intervals:
    blackbox_loss: 50
    loss_series: 50
    grad_cosine: 50
    avg_cosine: 50
    fedmia_loss: 50
    gradient_diff: 50
    score_diff: 50
    score_ratio: 50
    fta: 50
    projres: 50
  score_ratio_damping: 1.0e-6
  fta_measurement: confidence
  signal_storage: compact
  low_fpr_min_nonmembers: 1000
  low_fpr_max_members: 100
  low_fpr_max_nonmembers: 1000

# Rank each client's exact upload batch after rounds 50, 100, ..., 500.
# This analysis is observational and does not filter samples or alter training.
defense:
  name: iclr
  iclr_analysis_interval: 50
  iclr_analysis_timing: post_round
  iclr_feature_statistics: false
  iclr_validation_top_fraction: 0.2

projres:
  enabled: true
  # Audit real target-client uploads after rounds 50, 100, ..., 500.
  evaluation_interval: 50
  decision_mode: ranking
  threshold: null
  # The unified scorer audits the complete batch and its shared 1:10
  # nonmember view; these bounds document the full 16/160 case.
  max_candidates: 16
  min_nonmembers: 160
  max_nonmembers: 160
  token_reduction: auto
