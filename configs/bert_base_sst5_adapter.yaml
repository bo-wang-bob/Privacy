model_type: bert_adapter
architecture: bert
model_path: ./checkpoints/bert-base-uncased
dataset_path: ./data/huggingface/sst5
dataset_name: sst5

# Use synchronous FedSGD with 30 IID clients and one local batch of 16 examples
# per communication round, matching Deng et al.'s batch-size-16 protocol.
total_users: 30
sample_users: 30
num_global_iters: 500
batch_size: 16
eval_batch_size: 32
# Keep the effective 5e-3 step through 300 completed rounds, then halve it for
# the last 200 rounds to refine the SST-5 solution after its observed plateau.
learning_rate: 0.005
learning_rate_decay: 0.5
learning_rate_decay_interval: 300
eval_interval: 50
aggregation_weighting: uniform

max_length: 128
adapter:
  reduction: 2
  activation: relu
  classifier_dropout: 0.0
  gradient_checkpointing: false
  # Initialize the up projection from N(0, 0.02^2), using the pretrained
  # BERT initializer range, so both Adapter projections receive gradients from
  # the first client step without an exact-zero residual branch.
  zero_init_up: false

# Keep real one-batch vanilla-SGD uploads and one scalar learning rate for all
# trainable parameters, so cosine attacks retain their original definition.
optimization:
  client_optimizer: sgd
  momentum: 0.0
  weight_decay: 0.0
  # Zero disables gradient clipping and preserves the raw one-batch SGD update.
  max_grad_norm: 0.0

gpu: 0
require_cuda: false
seed: 42
save_models: false
results_dir: ./results

# All candidates for a client are 1:1 exact class-matched train/validation
# pairs. Validation examples are never used by any federated client.
audit:
  enabled: true
  strict: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
  target_client_id: 0
  audit_client_ids: [0]
  candidate_sampling: balanced_holdout
  audit_batch_size: 16
  # Collect every configured attack after 50, 100, ..., 500 completed rounds.
  audit_interval: 50
  attack_audit_intervals:
    blackbox_loss: 50
    loss_series: 50
    grad_cosine: 50
    avg_cosine: 50
    fedmia_loss: 50
    fedmia_cosine: 50
  signal_storage: compact
  # Deng et al. repeat each member state 100 times. This cap affects IMDB;
  # the smaller per-client SST-5/CoLA holdouts remain fully included.
  low_fpr_max_members: 100
  low_fpr_max_nonmembers: 100

projres:
  enabled: true
  # Audit real target-client uploads after rounds 50, 100, ..., 500.
  evaluation_interval: 50
  threshold: 0.01
  # Audit the complete observed FedSGD batch.
  max_candidates: 16
  min_nonmembers: 100
  max_nonmembers: 1000
  token_reduction: auto
