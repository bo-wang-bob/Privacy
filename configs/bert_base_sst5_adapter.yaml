model_type: bert_adapter
architecture: bert
model_path: ./checkpoints/bert-base-uncased
dataset_path: ./data/huggingface/sst5
dataset_name: sst5

# Use synchronous FedSGD with 30 IID clients and one local batch of 32 examples
# per communication round. This keeps the one-batch threat model but is a
# larger-batch variant of Deng et al.'s batch-size-16 training protocol.
total_users: 30
sample_users: 30
num_global_iters: 300
batch_size: 32
eval_batch_size: 32
learning_rate: 0.001
learning_rate_decay: 1.0
learning_rate_decay_interval: 50
eval_interval: 5
aggregation_weighting: uniform

max_length: 128
adapter:
  reduction: 2
  activation: relu
  classifier_dropout: 0.0
  gradient_checkpointing: false
  # Preserve the pretrained representation at round 0. The Adapter residual
  # branch becomes trainable as soon as its zero-initialized up projection
  # receives the first gradient.
  zero_init_up: true

# Keep real one-batch vanilla-SGD uploads and one scalar learning rate for all
# trainable parameters, so cosine attacks retain their original definition.
optimization:
  client_optimizer: sgd
  momentum: 0.0
  weight_decay: 0.0
  max_grad_norm: 1.0

gpu: 0
require_cuda: false
seed: 42
save_models: false
results_dir: ./results

# All candidates for a client are 1:1 exact class-matched train/validation
# pairs. Validation examples are never used by any federated client.
audit:
  enabled: true
  strict: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
  target_client_id: 0
  audit_client_ids: [0]
  candidate_sampling: balanced_holdout
  audit_batch_size: 16
  audit_interval: 10
  attack_audit_intervals:
    loss_series: 10
    avg_cosine: 10
    fedmia_loss: 10
    fedmia_cosine: 10
  signal_storage: compact
  # Deng et al. repeat each member state 100 times. This cap affects IMDB;
  # the smaller per-client SST-5/CoLA holdouts remain fully included.
  low_fpr_max_members: 100
  low_fpr_max_nonmembers: 100

projres:
  enabled: true
  evaluation_round: last
  threshold: 0.01
  # Audit the complete observed FedSGD batch.
  max_candidates: 32
  min_nonmembers: 100
  max_nonmembers: 1000
  token_reduction: auto
