name: visual_adapter_fedmia_attacks
base_config: configs/visual_adapter_low_fpr_attacks.yaml
results_root: results

gpus: [0]
jobs: 1
seeds: [42]
target_client_ids: [0]

# Visual Adapter keeps the FPL-style system-wide 16-shot data protocol while
# using the same FedMIA training schedule on every dataset.
datasets:
  - name: caltech101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: oxfordpets
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: flowers
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: food101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: cifar100
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300

common:
  model_type: visual_adapter
  train_mode: centralized
  aggregator: fedavg
  data_root: ./data
  cache_dir: ./checkpoints/clip-vit-base-patch32
  require_cuda: true
  # Use an IID client split for record-level MIA evaluation. This avoids
  # letting attacks exploit the target client's non-IID label distribution.
  partition_mode: iid
  # Retained for config/CLI compatibility; ignored when partition_mode=iid.
  dirichlet_alpha: 0.1
  use_full_dataset: false
  fpl_shots: 16
  local_epochs: 1
  learning_rate: 0.001
  # Step decay: keep LR fixed for five rounds, then multiply it by 0.99.
  learning_rate_decay: 0.99
  learning_rate_decay_interval: 5
  batch_size: 32
  eval_batch_size: 512
  eval_interval: 5
  save_models: false
  visual_adapter:
    feature_dim: 512
    reduction: 4
    alpha: 0.2
    output_relu: true
    precompute_features: true
    precompute_batch_size: 64
    template: null
  audit:
    enabled: true
    strict: true
    target_client_id: 0
    ensure_target_participation: true
    attacks:
      - blackbox_loss
      - loss_series
      - grad_cosine
      - avg_cosine
      - fedmia_loss
      - fedmia_cosine
    candidate_sampling: low_fpr_full
    low_fpr_min_nonmembers: 1000
    # Match the CLIP-MLP audit budget and deterministic stratified sampling.
    low_fpr_max_members: 5000
    low_fpr_max_nonmembers: 20000
    match_candidate_labels: false
    audit_batch_size: 512
    audit_interval: 5
    attack_audit_intervals:
      # Match the released FedMIA code's checkpoints: rounds 10, 20, ..., 300.
      loss_series: 10
      avg_cosine: 10
      fedmia_loss: 10
      fedmia_cosine: 10
    low_fpr_gradient_batch_size: 16
    signal_storage: compact
    fedmia_tail: upper
    fedmia_tail_calibration_fraction: 0.25
    training_health_check: true

# ProjRes attacks the visual Adapter's first downsampling layer, matching the
# paper's one-batch/one-step FedSGD threat model.
projres:
  enabled: true
  threshold: 0.01
  max_candidates: 32
  min_nonmembers: 1000
  max_nonmembers: 0

defenses:
  - name: none
