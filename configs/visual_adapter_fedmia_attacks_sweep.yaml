name: visual_adapter_fedmia_attacks
base_config: configs/visual_adapter_low_fpr_attacks.yaml
results_root: results/visual_adapter_fedmia_attacks

gpus: [0]
jobs: 1
seeds: [42]
target_client_ids: [0]

# Visual Adapter follows the FPL-style system-wide 16-shot protocol.
datasets:
  - name: caltech101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: oxfordpets
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: flowers
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: food101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: cifar100
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 50

common:
  model_type: visual_adapter
  train_mode: centralized
  aggregator: fedavg
  data_root: ./data
  cache_dir: ./checkpoints/clip-vit-base-patch32
  require_cuda: true
  partition_mode: dirichlet
  dirichlet_alpha: 0.1
  use_full_dataset: false
  fpl_shots: 16
  local_epochs: 5
  learning_rate: 0.001
  batch_size: 128
  eval_batch_size: 512
  eval_interval: 5
  save_models: false
  visual_adapter:
    feature_dim: 512
    reduction: 4
    alpha: 0.2
    output_relu: true
    precompute_features: true
    precompute_batch_size: 64
    template: null
  audit:
    enabled: true
    strict: true
    target_client_id: 0
    ensure_target_participation: true
    attacks:
      - blackbox_loss
      - loss_series
      - grad_cosine
      - avg_cosine
      - fedmia_loss
      - fedmia_cosine
    candidate_sampling: low_fpr_full
    low_fpr_min_nonmembers: 1000
    match_candidate_labels: false
    audit_batch_size: 512
    audit_interval: 5
    attack_audit_intervals:
      loss_series: 1
      avg_cosine: 1
      fedmia_loss: 1
      fedmia_cosine: 1
    low_fpr_gradient_batch_size: 16
    signal_storage: compact
    fedmia_tail: upper
    fedmia_tail_calibration_fraction: 0.25
    training_health_check: true

# ProjRes attacks the visual Adapter's first downsampling layer, matching the
# paper's one-batch/one-step FedSGD threat model.
projres:
  enabled: true
  threshold: 0.01
  max_candidates: 32
  min_nonmembers: 1000
  max_nonmembers: 0

defenses:
  - name: none
