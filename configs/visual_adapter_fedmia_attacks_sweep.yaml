name: visual_adapter_fedmia_attacks
base_config: configs/visual_adapter_low_fpr_attacks.yaml
results_root: results

gpus: [0]
jobs: 1
seeds: [42]
# One anchor job per dataset/seed; the audit itself targets every client.
target_client_ids: [0]

# Visual Adapter keeps the FPL-style system-wide 16-shot data protocol while
# using one mini-batch FedSGD update per client and communication round.
datasets:
  - name: caltech101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: oxfordpets
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: flowers
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: food101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: cifar100
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300

common:
  model_type: visual_adapter
  aggregator: fedsgd
  aggregation_weighting: uniform
  data_root: ./data
  cache_dir: ./checkpoints/clip-vit-base-patch32
  require_cuda: true
  # Use an IID client split for record-level MIA evaluation. This avoids
  # letting attacks exploit the target client's non-IID label distribution.
  partition_mode: iid
  # Retained for config/CLI compatibility; ignored when partition_mode=iid.
  dirichlet_alpha: 0.1
  use_full_dataset: false
  fpl_shots: 16
  local_epochs: 1
  learning_rate: 0.001
  # Keep the client learning rate constant for all communication rounds.
  learning_rate_decay: 1.0
  batch_size: 32
  eval_batch_size: 512
  eval_interval: 5
  save_models: false
  visual_adapter:
    feature_dim: 512
    reduction: 4
    alpha: 0.2
    output_relu: true
    text_adapter_enabled: true
    text_reduction: 4
    text_alpha: 0.2
    text_output_relu: true
    precompute_features: true
    precompute_batch_size: 64
    template: null
  audit:
    enabled: true
    strict: true
    audit_client_ids: all
    target_client_id: 0
    ensure_target_participation: true
    attacks:
      - blackbox_loss
      - loss_series
      - grad_cosine
      - avg_cosine
      - fedmia_loss
      - fedmia_cosine
    candidate_sampling: balanced_holdout
    # Per client, pair target-train members with never-trained target-test
    # non-members using identical class counts and a strict 1:1 ratio.
    low_fpr_max_members: 5000
    low_fpr_max_nonmembers: 5000
    match_candidate_labels: true
    audit_batch_size: 512
    attack_audit_intervals:
      # Measure every 10 completed rounds: rounds 10, 20, ..., 300.
      loss_series: 10
      avg_cosine: 10
      fedmia_loss: 10
      fedmia_cosine: 10
    low_fpr_gradient_batch_size: 16
    signal_storage: compact
    fedmia_tail: upper
    fedmia_tail_calibration_fraction: 0.25
    training_health_check: true

# ProjRes attacks the visual Adapter's first downsampling layer using the real
# one-batch FedSGD upload at the selected round.
projres:
  enabled: true
  # Observe the real uploaded client updates from the final communication round.
  evaluation_round: last
  threshold: 0.01
  max_candidates: 32
  min_nonmembers: 1000
  max_nonmembers: 20000

defenses:
  - name: none
