name: visual_adapter_fedmia_attacks
base_config: configs/visual_adapter_low_fpr_attacks.yaml
results_root: results

gpus: [0]
jobs: 1
seeds: [42]
# One target-client audit job per dataset/seed.
target_client_ids: [0]

# Visual Adapter uses the complete training split while retaining one
# mini-batch FedSGD update per client and communication round.
datasets:
  - name: caltech101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: oxfordpets
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: flowers
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: food101
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300
  - name: cifar100
    overrides:
      total_users: 10
      sample_users: 10
      num_global_iters: 300

common:
  model_type: visual_adapter
  aggregator: fedsgd
  aggregation_weighting: uniform
  data_root: ./data
  cache_dir: ./checkpoints/clip-vit-base-patch32
  require_cuda: true
  # Use an IID client split for record-level MIA evaluation. This avoids
  # letting attacks exploit the target client's non-IID label distribution.
  partition_mode: iid
  # Retained for config/CLI compatibility; ignored when partition_mode=iid.
  dirichlet_alpha: 0.1
  use_full_dataset: true
  fpl_shots: null
  local_epochs: 1
  learning_rate: 0.001
  # Keep the client learning rate constant for all communication rounds.
  learning_rate_decay: 1.0
  batch_size: 32
  eval_batch_size: 512
  eval_interval: 5
  save_models: false
  visual_adapter:
    feature_dim: 512
    reduction: 4
    alpha: 0.2
    output_relu: true
    text_adapter_enabled: true
    text_reduction: 4
    text_alpha: 0.2
    text_output_relu: true
    precompute_features: true
    precompute_batch_size: 64
    template: null
  audit:
    enabled: true
    strict: true
    audit_client_ids: [0]
    target_client_id: 0
    ensure_target_participation: true
    attacks:
      - blackbox_loss
      - loss_series
      - grad_cosine
      - avg_cosine
      - fedmia_loss
      - gradient_diff
      - score_diff
      - score_ratio
      - fta
      - projres
    candidate_sampling: balanced_global_holdout
    nonmember_to_member_ratio: 10
    exact_batch_membership_attacks:
      - blackbox_loss
      - grad_cosine
      - gradient_diff
      - projres
      - score_diff
      - score_ratio
    exact_batch_nonmember_to_member_ratio: 10
    paper_balanced_evaluation_size: 100
    low_fpr_min_nonmembers: 1000
    low_fpr_max_members: 100
    low_fpr_max_nonmembers: 1000
    match_candidate_labels: true
    audit_batch_size: 512
    attack_audit_intervals:
      blackbox_loss: 10
      loss_series: 10
      grad_cosine: 10
      avg_cosine: 10
      fedmia_loss: 10
      gradient_diff: 10
      score_diff: 10
      score_ratio: 10
      fta: 10
      projres: 10
    score_ratio_damping: 1.0e-6
    fta_measurement: confidence
    low_fpr_gradient_batch_size: 16
    signal_storage: compact
    fedmia_tail: upper
    fedmia_tail_calibration_fraction: 0.25
    training_health_check: true

# ProjRes shares the exact same 32/320 candidates and schedule as the other
# exact-batch attacks.
projres:
  enabled: true
  evaluation_interval: 10
  decision_mode: ranking
  threshold: null
  max_candidates: 32
  min_nonmembers: 320
  max_nonmembers: 320

defenses:
  - name: none
