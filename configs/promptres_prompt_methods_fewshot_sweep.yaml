name: promptres_prompt_methods_fewshot
base_config: configs/federated_prompt_paper.yaml
results_root: results/promptres_prompt_methods_fewshot

# Match the existing few-shot prompt-method sweep: one model per GPU.
gpus: [1]
minimum_free_memory_mb: 7000
jobs: 1

seeds: [42, 1337, 2027]
target_client_ids: [0]

methods:
  - promptfl
  - fedotp
  - fedpgp

datasets:
  - name: caltech101
    overrides:
      dataset_name: caltech101
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: oxfordpets
    overrides:
      dataset_name: oxfordpets
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: flowers
    overrides:
      dataset_name: flowers
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: food101
    overrides:
      dataset_name: food101
      total_users: 10
      sample_users: 10
      num_global_iters: 50
  - name: cifar100
    overrides:
      dataset_name: cifar100
      total_users: 10
      sample_users: 10
      num_global_iters: 50

common:
  data_root: ./data
  cache_dir: ./checkpoints/clip-vit-base-patch32
  require_cuda: true
  partition_mode: dirichlet
  use_full_dataset: false
  fpl_shots: 16
  dirichlet_alpha: 0.1
  local_epochs: 5
  learning_rate: 0.005
  batch_size: 16
  eval_batch_size: 64
  eval_interval: 5
  n_ctx: 16
  class_specific_ctx: false
  save_models: false
  audit:
    enabled: true
    strict: true
    audit_view: protocol_plus_released_prompts
    attacks: [promptres]
    target_client_id: 0
    audit_client_ids: all
    allow_partial_client_audit: true
    ensure_target_participation: true
    audit_interval: 1
    audit_batch_size: 16
    # Keep every target-client training example in the 16-shot pool; these are
    # caps, while the realized member and non-member counts are equal.
    max_member_samples: 2048
    max_nonmember_samples: 2048
    # Use one independent-test source plus one training source per non-target
    # client, with an overall 1:1 member/non-member ratio.
    candidate_sampling: fedmia_mix
    nonmember_to_member_ratio: 1.0
    match_candidate_labels: false
    signal_storage: compact
    promptres_background_rank: 0
    promptres_aggregation: mean
    training_health_check: true
    fedmia_signal_health_check: false
  defense:
    name: none

defenses:
  - name: none
