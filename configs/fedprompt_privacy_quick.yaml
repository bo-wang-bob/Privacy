train_mode: centralized
dataset_name: cifar100
batch_size: 8
eval_batch_size: 32
learning_rate: 0.001
num_global_iters: 2
local_epochs: 1
total_users: 4
sample_users: 4
aggregator: fedavg
dirichlet_alpha: 100
gpu: 0
seed: 42
fpl_shots: 4
cache_dir: ./checkpoints/clip-vit-base-patch32
n_ctx: 8
class_specific_ctx: false
model_load_path: null
save_models: false
eval_interval: 1
results_dir: ./results

audit:
  enabled: true
  strict: true
  target_client_id: 0
  ensure_target_participation: true
  attacks: [nasr_passive, fedmia_loss, fedmia_cosine, transfer_representation, codepoison, pipra, rmia, imia, quantile_mia, yoqo, canary, promptmia]
  max_samples_per_group: 4
  audit_interval: 1
  calibration_fraction: 0.5
  codepoison_weight: 1.0
  synthetic_mean: 0.0
  synthetic_std: 0.1
  auxiliary_fraction: 0.5
  qmia_epochs: 10
  pipra_shadow_prompts: 2
  pipra_shadow_steps: 1
  pipra_attack_epochs: 10
  imia_models: 1
  imia_warmup_steps: 1
  imia_imitation_steps: 1
  imia_pivot_steps: 1
  query_max_samples: 4
  query_reference_models: 1
  yoqo_steps: 1
  canary_num_queries: 1
  canary_steps: 1
  canary_shadow_steps: 1
  promptmia_max_samples: 4
  promptmia_keys: 2

defense:
  name: none
  dp_max_grad_norm: 1.0
  dp_noise_multiplier: 1.0
  dp_delta: 0.00001
  cofedmid_intervals: 2
  cofedmid_recycle_ratio: 0.1
  cofedmid_entropy_weight: 0.05
  cofedmid_exp3_gamma: 0.2
  cofedmid_noise_std: 0.05
  cofedmid_perturb_ratio: 0.1
  mist_cross_steps: 1
  mist_cross_weight: 1.0
  soft_obfuscation_strength: 0.5
  soft_noise_std: 0.05
  hamp_true_probability: 0.6
  hamp_entropy_weight: 0.05
  hamp_output_temperature: 4.0
