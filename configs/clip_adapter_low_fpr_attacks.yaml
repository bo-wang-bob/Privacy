model_type: clip_adapter
dataset_name: caltech101
data_root: ./data
batch_size: 32
eval_batch_size: 512
learning_rate: 0.001
learning_rate_decay: 1.0
num_global_iters: 50
local_epochs: 1
total_users: 10
sample_users: 10
aggregator: fedsgd
aggregation_weighting: uniform

clip_adapter:
  feature_dim: 512
  reduction: 4
  alpha: 0.2
  output_relu: true
  text_adapter_enabled: true
  text_reduction: 4
  text_alpha: 0.2
  text_output_relu: true
  precompute_features: true
  # Keep raw-image CLIP encoding separate from the larger cached-vector batches.
  precompute_batch_size: 64
  template: null

# Use an IID client split so membership is not confounded by client label skew.
partition_mode: iid
# Retained for config/CLI compatibility; ignored when partition_mode=iid.
dirichlet_alpha: 0.1
use_full_dataset: false
fpl_shots: 16
gpu: 0
seed: 42
cache_dir: ./checkpoints/clip-vit-base-patch32
model_load_path: null
save_models: false
eval_interval: 5
results_dir: ./results

audit:
  enabled: true
  strict: true
  audit_view: protocol_plus_released_prompts
  # Match the BERT protocol: audit one target client per training task.
  audit_client_ids: [0]
  target_client_id: 0
  ensure_target_participation: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
    - gradient_diff
    - score_diff
    - score_ratio
    - fta
    - projres
  candidate_sampling: balanced_global_holdout
  # Match BERT/GPT2 for the five fixed-candidate attacks: retain the complete
  # target-client training set and pair it with an equal-sized global holdout.
  require_full_target_train_members: true
  nonmember_to_member_ratio: 1
  exact_batch_membership_attacks:
    - blackbox_loss
    - grad_cosine
    - gradient_diff
    - projres
    - score_diff
    - score_ratio
  exact_batch_nonmember_to_member_ratio: 10
  paper_balanced_evaluation_size: 100
  low_fpr_min_nonmembers: 2
  low_fpr_max_members: 0
  low_fpr_max_nonmembers: 0
  match_candidate_labels: true
  audit_batch_size: 512
  attack_audit_intervals:
    blackbox_loss: 10
    loss_series: 10
    grad_cosine: 10
    avg_cosine: 10
    fedmia_loss: 10
    fedmia_cosine: 10
    gradient_diff: 10
    score_diff: 10
    score_ratio: 10
    fta: 10
    projres: 10
  score_ratio_damping: 1.0e-6
  fta_measurement: confidence
  low_fpr_gradient_batch_size: 16
  signal_storage: compact
  fedmia_tail: upper
  fedmia_tail_calibration_fraction: 0.25
  training_health_check: true

projres:
  enabled: true
  evaluation_interval: 10
  decision_mode: ranking
  threshold: null
  max_candidates: 32
  min_nonmembers: 320
  max_nonmembers: 320

defense:
  name: none
