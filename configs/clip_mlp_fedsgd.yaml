model_type: clip_mlp
dataset_name: caltech101
data_root: ./data
batch_size: 32
eval_batch_size: 512
learning_rate: 0.1
learning_rate_decay: 1.0
num_global_iters: 20
local_epochs: 1
total_users: 10
sample_users: 10
aggregator: fedsgd
aggregation_weighting: uniform

clip_mlp:
  hidden_dim: 512
  dropout: 0.0
  normalize_features: false
  precompute_features: true
  precompute_batch_size: 64

partition_mode: iid
dirichlet_alpha: 0.1
use_full_dataset: false
fpl_shots: 16
gpu: 0
seed: 42
cache_dir: ./checkpoints/clip-vit-base-patch32
model_load_path: null
save_models: false
eval_interval: 5
results_dir: ./results

audit:
  enabled: false
  attacks: []
  training_health_check: true

defense:
  name: none
