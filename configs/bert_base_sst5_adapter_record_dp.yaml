model_type: bert_adapter
architecture: bert
model_path: ./checkpoints/bert-base-uncased
dataset_path: ./data/huggingface/sst5
dataset_name: sst5

total_users: 30
sample_users: 30
num_global_iters: 500
batch_size: 16
eval_batch_size: 32
learning_rate: 0.005
learning_rate_decay: 1.0
learning_rate_decay_interval: 50
eval_interval: 50
aggregation_weighting: uniform

max_length: 128
adapter:
  reduction: 2
  activation: relu
  classifier_dropout: 0.0
  gradient_checkpointing: false
  zero_init_up: true

optimization:
  client_optimizer: sgd
  momentum: 0.0
  weight_decay: 0.0
  # Batch-level clipping remains disabled; Record-DP performs per-sequence
  # clipping across every trainable Adapter and classifier parameter.
  max_grad_norm: 0.0

gpu: 0
require_cuda: false
seed: 42
save_models: false
results_dir: ./results

audit:
  enabled: true
  strict: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - fedmia_cosine
    - gradient_diff
    - score_diff
    - score_ratio
    - fta
    - projres
  target_client_id: 0
  audit_client_ids: [0]
  candidate_sampling: balanced_global_holdout
  require_full_target_train_members: true
  nonmember_to_member_ratio: 1
  exact_batch_membership_attacks:
    - blackbox_loss
    - grad_cosine
    - gradient_diff
    - projres
    - score_diff
    - score_ratio
  exact_batch_nonmember_to_member_ratio: 10
  paper_balanced_evaluation_size: 100
  audit_batch_size: 16
  audit_interval: 50
  attack_audit_intervals:
    blackbox_loss: 50
    loss_series: 10
    grad_cosine: 50
    avg_cosine: 10
    fedmia_loss: 10
    fedmia_cosine: 10
    gradient_diff: 50
    score_diff: 50
    score_ratio: 50
    fta: 10
    projres: 50
  score_ratio_damping: 1.0e-6
  fta_measurement: confidence
  signal_storage: compact
  low_fpr_min_nonmembers: 2
  low_fpr_max_members: 0
  low_fpr_max_nonmembers: 0

defense:
  name: record_dp
  adjacency: add_remove
  sampling: poisson
  accountant: rdp
  max_grad_norm: 1.0
  target_epsilon: 3.0
  delta: 1.0e-5
  noise_multiplier: auto
  # The shared Transformer wrapper is intentionally handled by the generic
  # reference backend; it clips one complete sequence at a time.
  grad_sample_backend: loop
  microbatch_size: 16
  reproducible_noise: false
  release_private_diagnostics: false

projres:
  enabled: true
  evaluation_interval: 50
  decision_mode: ranking
  threshold: null
  # Poisson batch cardinality is data-independent but variable, so the unified
  # exact-batch scorer derives all candidate counts from the observed batch.
  max_candidates: 0
  min_nonmembers: 0
  max_nonmembers: 0
  token_reduction: auto
