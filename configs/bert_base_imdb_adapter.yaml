model_type: bert_adapter
architecture: bert
model_path: ./checkpoints/bert-base-uncased
dataset_path: ./data/huggingface/imdb
dataset_name: imdb

# Use synchronous FedSGD with 30 IID clients and one local batch of 16 examples
# per communication round, matching Deng et al.'s batch-size-16 protocol.
total_users: 30
sample_users: 30
num_global_iters: 500
batch_size: 16
eval_batch_size: 32
# Keep the existing round-500 decay boundary. With a 500-round run, every
# completed training round still uses 5e-3 and the later refinement phase is omitted.
learning_rate: 0.005
learning_rate_decay: 0.5
learning_rate_decay_interval: 500
eval_interval: 50
aggregation_weighting: uniform

max_length: 128
adapter:
  reduction: 2
  activation: relu
  classifier_dropout: 0.0
  gradient_checkpointing: false
  # Start the residual Adapter as an exact identity mapping.
  zero_init_up: true

optimization:
  client_optimizer: sgd
  momentum: 0.0
  weight_decay: 0.0
  max_grad_norm: 0.0

gpu: 0
require_cuda: false
seed: 42
save_models: false
results_dir: ./results

audit:
  enabled: true
  strict: true
  attacks:
    - blackbox_loss
    - loss_series
    - grad_cosine
    - avg_cosine
    - fedmia_loss
    - gradient_diff
    - score_diff
    - score_ratio
    - fta
    - projres
  target_client_id: 0
  audit_client_ids: [0]
  candidate_sampling: balanced_global_holdout
  nonmember_to_member_ratio: 10
  # These six update-sensitive attacks use the target client's exact upload
  # batch as members at every audit round. Formulas remain unchanged.
  exact_batch_membership_attacks:
    - blackbox_loss
    - grad_cosine
    - gradient_diff
    - projres
    - score_diff
    - score_ratio
  exact_batch_nonmember_to_member_ratio: 10
  paper_balanced_evaluation_size: 100
  audit_batch_size: 16
  audit_interval: 50
  attack_audit_intervals:
    blackbox_loss: 50
    loss_series: 50
    grad_cosine: 50
    avg_cosine: 50
    fedmia_loss: 50
    gradient_diff: 50
    score_diff: 50
    score_ratio: 50
    fta: 50
    projres: 50
  score_ratio_damping: 1.0e-6
  fta_measurement: confidence
  signal_storage: compact
  low_fpr_min_nonmembers: 1000
  low_fpr_max_members: 100
  low_fpr_max_nonmembers: 1000

# Rank each client's exact upload batch after rounds 50, 100, ..., 500.
# This analysis is observational and does not filter samples or alter training.
defense:
  name: iclr
  iclr_analysis_interval: 50
  iclr_analysis_timing: post_round
  iclr_feature_statistics: false
  iclr_validation_top_fraction: 0.2

projres:
  enabled: true
  evaluation_interval: 50
  decision_mode: ranking
  threshold: null
  # Shared exact-batch view; 160 is the full-batch 16 * 10 case.
  max_candidates: 16
  min_nonmembers: 160
  max_nonmembers: 160
  token_reduction: auto
